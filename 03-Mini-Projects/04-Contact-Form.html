<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Acme Support</title>
</head>
<body>

  <!-- Header & Navigation -->
  <header>
    <h1>Acme Support</h1>
    <nav>
      <a href="#home">Home</a>
      <a href="#help">Help</a>
      <a href="#contact">Contact</a>
    </nav>
    <hr>
  </header>

  <!-- Main Content / Contact Form -->
  <main>
    <h2>Contact us</h2>
    <p>Send us a message and we will get back to you.</p>

    <form>
      <div>
        <label for="name">Full name</label>
        <input type="text" id="name" name="name">
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email">
      </div>

      <div>
        <label for="subject">Subject</label>
        <select id="subject" name="subject">
          <option value="" disabled selected>Choose a topic</option>
          <option value="general">General Inquiry</option>
          <option value="technical">Technical Support</option>
          <option value="billing">Billing</option>
        </select>
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>
      </div>

      <fieldset>
        <legend>How did you hear about us?</legend>
        <div>
          <input type="radio" id="search" name="source" value="search">
          <label for="search">Search</label>
        </div>
        <div>
          <input type="radio" id="friend" name="source" value="friend">
          <label for="friend">Friend</label>
        </div>
        <div>
          <input type="radio" id="social" name="source" value="social">
          <label for="social">Social media</label>
        </div>
      </fieldset>

      <div>
        <input type="checkbox" id="updates" name="updates">
        <label for="updates">Send me product updates</label>
      </div>

      <button type="submit">Send message</button>
    </form>
  </main>

  <!-- Footer -->
  <footer>
    <hr>
    <p>&copy; 2026 Acme Support</p>
  </footer>

</body>
</html>
