<!-- ==========================================
     FILE 2: Form Advanced (form-advanced.html)
     Topics Covered:
     - <form> with method="post" & enctype="multipart/form-data"
     - <fieldset> and <legend>
     - <datalist> for autocomplete suggestions
     - Number input with min and max
     - Date input with min and max
     - File upload input
     - Attributes: readonly, autocomplete, minlength, maxlength, pattern
     - Built-in HTML form validation
     - Alternative <input type="submit"> & <input type="reset">
     ========================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms - Part 2 (Advanced)</title>
</head>
<body>

    <h1>HTML Forms - Advanced</h1>

    <!-- Form container using POST method and enctype for file uploads -->
    <form action="/submit-advanced" method="post" enctype="multipart/form-data">

        <!-- Fieldset grouping advanced settings -->
        <fieldset>
            <!-- Legend provides a caption for the fieldset -->
            <legend>
                Advanced Validation & Profile
            </legend>

            <!-- Readonly input (selectable and submitted, but cannot be modified) -->
            <label for="user-id">
                User ID (Read Only):
            </label>

            <input
                type="text"
                id="user-id"
                name="user_id"
                value="USR-2026-99"
                readonly
            >

            <br><br>

            <!-- Autocomplete and Length Validation (minlength / maxlength) -->
            <label for="full-name">
                Full Name (3 to 30 characters):
            </label>

            <input
                type="text"
                id="full-name"
                name="full_name"
                autocomplete="name"
                minlength="3"
                maxlength="30"
                required
            >

            <br><br>

            <!-- Datalist input (provides predefined autocomplete suggestions while allowing custom text) -->
            <label for="browser-choice">
                Preferred Browser:
            </label>

            <input
                type="text"
                id="browser-choice"
                name="browser"
                list="browsers-list"
                placeholder="Type or pick a browser"
            >

            <!-- Datalist holding the suggestion options linked via the list attribute -->
            <datalist id="browsers-list">
                <option value="Google Chrome">
                <option value="Mozilla Firefox">
                <option value="Brave">
                <option value="Microsoft Edge">
                <option value="Apple Safari">
            </datalist>

            <br><br>

            <!-- Number input with min and max constraints -->
            <label for="age">
                Age (18 to 99):
            </label>

            <input
                type="number"
                id="age"
                name="age"
                min="18"
                max="99"
                required
            >

            <br><br>

            <!-- Date input with range boundary constraints -->
            <label for="event-date">
                Event Date:
            </label>

            <input
                type="date"
                id="event-date"
                name="event_date"
                min="2026-01-01"
                max="2026-12-31"
                required
            >

            <br><br>

            <!-- Pattern attribute using Regular Expressions (Regex) -->
            <label for="zipcode">
                Postal Code (5 Digits):
            </label>

            <input
                type="text"
                id="zipcode"
                name="zipcode"
                pattern="[0-9]{5}"
                title="Please enter exactly 5 numbers"
                placeholder="e.g. 56001"
                required
            >

            <br><br>

            <!-- File input to upload files -->
            <label for="profile-pic">
                Upload Profile Picture:
            </label>

            <input
                type="file"
                id="profile-pic"
                name="profile_pic"
                accept="image/png, image/jpeg"
                required
            >

            <br><br>

            <!-- Form submission using <input type="submit"> -->
            <input
                type="submit"
                value="Upload & Save"
            >

            <!-- Form reset using <input type="reset"> -->
            <input
                type="reset"
                value="Clear All"
            >

        </fieldset>

    </form>

</body>
</html>
