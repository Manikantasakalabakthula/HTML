<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Paths</title>
</head>
<body>
        <h1>HTML File Paths</h1>

        <!--
            Absolute path
            --------------
            Complete URL/path to a resource.
        -->
        
        <a href="http://www.google.com">Absolute Path</a>

        <br><br>

        <!--
            Relative path
            --------------
            Path relative to the current HTML file.
        -->

        <!-- File in the folder -->
         <img src="/assets/images/image-2.png" alt="butterfly">
        
        <br><br>
        
        <!-- Link to file in same folder -->
         <a href="/01-Concepts/01-tags.html">Tags</a>
</body>
</html>
