<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Images</title>
</head>
<body>
    <h1>HTML Images</h1>

    <!-- basic Image -->
    <img
    src="/assets/images/image-7.png"
    alt="Beach"
    >
    
    <br><br>

    <!-- Width and height -->
    <img
    src="/assets/images/image-5.png"
    alt="Sun Rise"
    width="300px"
    height="300px"
    >

    <br><br>

    <!-- Image with title -->
    <img
    src="/assets/images/image-6.png"
    alt="Dog"
    title="Dog"
    >

    <br><br>

    <!-- Image as a link -->
    <a
    href="https://www.thestatesman.com/wp-content/uploads/2026/03/Spider-Man-Brand-New-Day-trailer-breakdown-New-suit-new-enemies-and-a-life-nobody-remembers.webp"
    target="_blank">
        <img
        src="/assets/images/BND.jpg"
        alt="BND"
        width="500px">
    </a>

    <br><br>

    <!-- Figure and figcaption -->
    <figure>
        <img
            src="/assets/images/image-9.png"
            alt="Park"
            width="500"
        >

        <figcaption>
            A beautiful Nature Park.
        </figcaption>
    </figure>
</body>
</html>
