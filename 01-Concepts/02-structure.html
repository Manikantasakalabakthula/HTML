<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Meta data -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Other metadata -->
    <meta name="description" content="Learning HTML document structure">

    <!-- Page title -->
    <title>HTML Structure</title>
</head>

    <!-- Visible content goes inside body -->

    <h1>HTML Document Structure</h1>
    <p>The Content is displayed in the browser</p>
</body>
</html>
