<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <h1>HTML Entities</h1>

    <!-- Less than -->
    <p>Less than: &lt;</p>

    <!-- Greater than -->
    <p>Greater than: &gt;</p>

    <!-- Ampersand -->
    <p>Ampersand: &amp;</p>

    <!-- Double quotation mark -->
    <p>Double quotation mark: &quot;</p>

    <!-- Single quotation mark -->
    <p>Single quotation mark: &apos;</p>

    <!-- Non-breaking space -->
    <p>Non-breaking space: Hello&nbsp;&nbsp;&nbsp;Wrold!</p>

    <!-- Copyright trademark -->
    <p>Copyright trademark: &copy; 2026 My Website.</p>

    <!-- Registered trademark -->
    <p>Registered trademark: &reg; My Brand</p>

    <!-- Trademark -->
    <p>Trademark: &trade; My Product</p>

    <!-- Rupee Symbol -->
    <p>Rupee Symbol: &#8377;500</p>
</body>
</html>
