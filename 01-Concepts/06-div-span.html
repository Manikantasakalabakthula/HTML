<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div and SPan</title>
</head>
<body>
    <h1>Div and Span</h1>

    <!-- 
        DIV
        ---
        A block-level container.
    -->
    <div>
        <h2>First Section</h2>
        <p>This content is inside a div.</p>
    </div>

    <div>
        <h2>Second Section</h2>
        <p>This is another div.</p>
    </div>

    <!--
        SPAN
        ----
        An inline container.
    -->

    <p>My favorite color is
        <span>blue.</span>
    </p>

    <p>
        This is
        <span>important text</span>
        inside a paragraph.
    </p>
</body>
</html>
