<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Multimedia</title>
</head>
<body>
    <h1>HTML Multimedia</h1>

    <!-- Audio -->
     <h2>Audio</h2>
    <audio
        src="/assets/audios/Audio.mp3"
        controls
    >
    </audio>

    <br><br>


    <video
        width="640"
        height="360"
        src="/assets/videos/Video.mp4"
        poster="/assets/images/BND.jpg"
        controls
    >
    </video>

    <br><br>

    <!-- Iframe -->

    <h2>Iframe</h2>

    <iframe
        src="https://www.Google.com"
        width="600"
        height="400"
        title="Example Website"
    ></iframe>

    <br><br>

    <!-- Embedded YouTube video -->

    <h2>Embedded Content</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube video player"
        allowfullscreen
    ></iframe>
</body>
</html>
