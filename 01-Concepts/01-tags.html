<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tags</title>
</head>
<body>
    <!-- 
        HTML Tags
        ----------
        Most HTML elements use:
        <opening-tag>Content</closing-tag>

        Example:
        <p>Hello World</p>

    -->
    
    <!-- Heading tag -->
     <h1>This is Heading</h1>

    <!-- Paragraph tag -->
     <p>This is Paragraph</p>
    
    <!-- Division tag -->
     <div>This is div element</div>

    <!-- span tag -->
     <span>This is span element</span>

    <!-- Line break -->
     <p>Hello<br>World!</p>
    
    <!-- Horizontal rule -->
     <hr>

    <!-- Image tag -->
     <img src="/assets/images/image-1.png" alt="Tree">
</body>
</html>
